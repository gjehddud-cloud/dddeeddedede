<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 채팅 어시스턴트</title>
    <style>
        /* [CSS 영역] */
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 80vh;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #075e54;
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #e5ddd5;
        }

        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
            position: relative;
        }

        .user-message {
            align-self: flex-end;
            background-color: #dcf8c6;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: white;
            border-bottom-left-radius: 2px;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #f0f0f0;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 25px;
            outline: none;
        }

        button {
            background-color: #075e54;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #128c7e;
        }

        /* 스크롤바 커스텀 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background-color: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">AI Chatbot</div>
        
        <div class="chat-messages" id="chat-messages">
            <div class="message ai-message">안녕하세요! 궁금한 점을 물어보세요.</div>
        </div>

        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="메시지를 입력하세요..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">전송</button>
        </div>
    </div>

    <script>
        /* [JavaScript 영역] */
        
        // 나중에 실제 API 키를 이곳에 정의하거나 호출 부분에 사용하세요.
        const API_KEY = "YOUR_API_KEY_HERE"; 

        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');

        async function sendMessage() {
            const messageText = userInput.value.trim();
            if (messageText === "") return;

            // 1. 사용자 메시지 추가
            appendMessage(messageText, 'user-message');
            userInput.value = "";

            // 2. AI 응답 처리 (로딩 표시 대신 가상 응답)
            // 실제 API 연동 시 이 부분을 fetch() 코드로 교체하시면 됩니다.
            try {
                // 여기에 API 호출 로직을 넣으세요.
                // 예: const response = await fetch('https://api.openai.com/v1/...', { ... });
                
                setTimeout(() => {
                    const aiResponse = `"${messageText}"에 대한 AI의 답변 예시입니다. API 키를 설정하여 실제 AI와 연결해보세요.`;
                    appendMessage(aiResponse, 'ai-message');
                }, 600);

            } catch (error) {
                appendMessage("에러가 발생했습니다. 다시 시도해주세요.", 'ai-message');
            }
        }

        function appendMessage(text, className) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', className);
            messageDiv.innerText = text;
            chatMessages.appendChild(messageDiv);

            // 스크롤 아래로 이동
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
